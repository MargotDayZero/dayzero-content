name: Renew Instagram token
on:
  schedule:
    - cron: "0 12 1,15 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get a fresh token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/refresh_token.py "$RUNNER_TEMP/new_token"
      - name: Save it as the new secret
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/new_token"
